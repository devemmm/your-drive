services:
  client:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3003}
        # Google Maps (frontend - restrict to HTTP referrers/websites)
        # VITE_GOOGLE_API_KEY: ...
        # Google OAuth
        # VITE_GOOGLE_CLIENT_ID: ...
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLIENT_PORT:-8480}:80"
    networks:
      - webproxy

networks:
  webproxy:
    external: true
    name: webproxy
