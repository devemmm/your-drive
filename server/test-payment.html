<!DOCTYPE html>
<html>
  <head>
    <title>Test Stripe Payment</title>
    <script src="https://js.stripe.com/v3/"></script>
  </head>
  <body>
    <h2>Stripe PaymentIntent Test</h2>
    <form id="payment-form">
      <div id="card-element"></div>
      <button type="submit">Pay</button>
    </form>

    <script>
      const stripe = Stripe('pk_test_51Mt9dkDznvSbNsXr44lzZMCrXMq2jE4atNW1UwX9AeUSa04fN7lDzfbCryGJ9UeLCS1ycB039MD22GneNnwXqGOS002kjLJu7a'); // STRIPE_PUBLISHABLE_KEY
      const elements = stripe.elements();
      const cardElement = elements.create('card');
      cardElement.mount('#card-element');

      const clientSecret = prompt("Paste your client_secret here:");

      document.getElementById('payment-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const { paymentIntent, error } = await stripe.confirmCardPayment(clientSecret, {
          payment_method: {
            card: cardElement
          }
        });

        if (error) {
          alert("❌ Error: " + error.message);
        } else if (paymentIntent && paymentIntent.status === "succeeded") {
          alert("✅ Payment succeeded!");
        }
      });
    </script>
  </body>
</html>
