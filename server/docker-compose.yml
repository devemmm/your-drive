services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SERVER_PORT:-3003}:3003"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: "3003"
      NODE_ENV: ${NODE_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-your-jwt-secret-change-me}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-RWF}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8480}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3003}
      # Google Maps (backend - restrict to server IP addresses)
      GOOGLE_SERVER_MAPS_API_KEY: ${GOOGLE_SERVER_MAPS_API_KEY}
      # Email (AWS SES)
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      SES_FROM_ADDRESS: ${SES_FROM_ADDRESS}
      # SMS provider selection: "sns" (default, uses the AWS creds above) or "twilio"
      SMS_PROVIDER: ${SMS_PROVIDER:-sns}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-}
      # SMS (Twilio)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      # Other third-party services (uncomment and add real keys as needed)
      # OPENAI_API_KEY: ...
      # FIREBASE_SERVICE_JSON_PATH: ...
      # S3-compatible storage (MinIO running on the host)
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET:-your-drive}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_FORCE_PATH_STYLE: "true"
      # Admin seed credentials
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@yourdrive.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Admin}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-User}
    extra_hosts:
      - "host.docker.internal:host-gateway"
