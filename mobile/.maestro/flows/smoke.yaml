# Sanity check: launches the app, asserts welcome renders, then logs in as
# the seeded passenger and confirms the home map screen mounts the real
# MapView (not the MapErrorBoundary fallback). This guards the QAT
# Android-launch crash where react-native-maps with PROVIDER_GOOGLE blew
# up on first render because the Android Maps API key was missing.
# Run me first to prove the harness works before adding more flows.
appId: ${MAESTRO_APP_ID}
---
- runScript: ../scripts/reset.js
- launchApp:
    clearState: true
    permissions:
      all: allow

# Welcome screen
- assertVisible:
    id: "welcome.actions"
- assertVisible:
    id: "welcome.loginButton"
- assertVisible:
    id: "welcome.signUpButton"

# Log in as the seeded passenger so we reach the home map.
- tapOn:
    id: "welcome.loginButton"
- tapOn:
    id: "auth.emailInput"
- inputText: ${output.passengerEmail}
- tapOn:
    id: "auth.passwordInput"
- inputText: ${output.password}
- tapOn:
    id: "auth.loginButton"

# Dismiss iOS Save Password dialog if it appears.
- tapOn:
    text: "Not Now"
    optional: true

# Home screen + map must render. If the Android Maps key were missing,
# MapErrorBoundary would render map.errorFallback instead of home.map.
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "home.map"
    timeout: 10000
- assertNotVisible:
    id: "map.errorFallback"
