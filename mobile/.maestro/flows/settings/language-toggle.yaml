# Asserts Kinyarwanda can be selected and persists across launches.
appId: ${MAESTRO_APP_ID}
---
- runScript: ../../scripts/reset.js
- launchApp:
    clearState: true
    permissions:
      all: allow

- tapOn:
    id: "welcome.loginButton"
- tapOn:
    id: "auth.emailInput"
- inputText: ${output.passengerEmail}
- tapOn:
    id: "auth.passwordInput"
- inputText: ${output.password}
- tapOn:
    id: "auth.loginButton"
# Dismiss iOS Save Password dialog if it appears.
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 15000

- tapOn:
    id: "home.menuButton"
- tapOn:
    id: "drawer.profile"

- scrollUntilVisible:
    element:
      id: "profile.languageOption.rw"
- tapOn:
    id: "profile.languageOption.rw"
# "Ururimi" is the Kinyarwanda translation of profile.language (the section title).
- scrollUntilVisible:
    element:
      text: "Ururimi"
- assertVisible: "Ururimi"

# Reopen app — preference persists.
- launchApp:
    clearState: false
- tapOn:
    id: "home.menuButton"
- tapOn:
    id: "drawer.profile"
- scrollUntilVisible:
    element:
      text: "Ururimi"
- assertVisible: "Ururimi"
