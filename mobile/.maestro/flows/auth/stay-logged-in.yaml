# QAT 3.4 — after a successful login, relaunching the app (without clearing
# state) keeps the user signed in and bypasses the welcome screen.
appId: ${MAESTRO_APP_ID}
---
- runScript: ../../scripts/reset.js
- launchApp:
    clearState: true
    permissions:
      all: allow
- tapOn:
    id: "welcome.loginButton"
- tapOn:
    id: "auth.emailInput"
- inputText: ${output.passengerEmail}
- tapOn:
    id: "auth.passwordInput"
- inputText: ${output.password}
- tapOn:
    id: "auth.loginButton"
# Dismiss iOS Save Password dialog if it appears.
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 15000
# Relaunch without clearing state — the persisted auth token should restore the session.
- launchApp:
    clearState: false
# Dismiss iOS Save Password dialog if it reappears after relaunch.
- tapOn:
    text: "Not Now"
    optional: true
- assertVisible:
    id: "home.screen"
- assertNotVisible:
    id: "welcome.loginButton"
