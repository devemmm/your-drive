# QAT 3.1 — login with correct email but wrong password is rejected.
appId: ${MAESTRO_APP_ID}
---
- runScript: ../../scripts/reset.js
- launchApp:
    clearState: true
    permissions:
      all: allow
- tapOn:
    id: "welcome.loginButton"
- tapOn:
    id: "auth.emailInput"
- inputText: ${output.passengerEmail}
- tapOn:
    id: "auth.passwordInput"
- inputText: "WrongPassword1"
- tapOn:
    id: "auth.loginButton"
# Server (auth.controller.ts login) returns 401 with this copy,
# surfaced through handleApiError → Alert.alert.
- assertVisible: "Invalid credentials."
- assertNotVisible:
    id: "home.screen"
