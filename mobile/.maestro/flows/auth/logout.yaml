# QAT 3.8 — signing out from the profile screen returns the user to the
# welcome screen (auth state cleared).
appId: ${MAESTRO_APP_ID}
---
- runScript: ../../scripts/reset.js
- launchApp:
    clearState: true
    permissions:
      all: allow
- tapOn:
    id: "welcome.loginButton"
- tapOn:
    id: "auth.emailInput"
- inputText: ${output.passengerEmail}
- tapOn:
    id: "auth.passwordInput"
- inputText: ${output.password}
- tapOn:
    id: "auth.loginButton"
# Dismiss iOS Save Password dialog if it appears.
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 15000
- tapOn:
    id: "home.menuButton"
- tapOn:
    id: "drawer.profile"
- scrollUntilVisible:
    element:
      id: "profile.logoutButton"
- tapOn:
    id: "profile.logoutButton"
- extendedWaitUntil:
    visible:
      id: "welcome.loginButton"
    timeout: 5000
