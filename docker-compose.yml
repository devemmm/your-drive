services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: yourdrive
      POSTGRES_PASSWORD: yourdrive_secret
      POSTGRES_DB: yourdrive
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yourdrive"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SERVER_PORT:-3003}:3003"
    environment:
      DATABASE_URL: postgresql://yourdrive:yourdrive_secret@db:5432/yourdrive
      PORT: "3003"
      NODE_ENV: ${NODE_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-your-jwt-secret-change-me}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-RWF}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8480}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3003}
      # Google Maps (backend - restrict to server IP addresses)
      GOOGLE_SERVER_MAPS_API_KEY: ${GOOGLE_SERVER_MAPS_API_KEY}
      # Email (AWS SES)
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      SES_FROM_ADDRESS: ${SES_FROM_ADDRESS}
      # SMS provider selection: "sns" (default, uses the AWS creds above) or "twilio"
      SMS_PROVIDER: ${SMS_PROVIDER:-sns}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-}
      # SMS (Twilio)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      # Other third-party services (uncomment and add real keys as needed)
      # OPENAI_API_KEY: ...
      # FIREBASE_SERVICE_JSON_PATH: ...
      # S3-compatible storage (MinIO for local dev)
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-your-drive}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9480/your-drive}
      S3_FORCE_PATH_STYLE: "true"
      # Admin seed credentials
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@yourdrive.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Admin}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-User}
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9480}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9481}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      # Public URLs - leave unset for local dev; set on staging/prod via .env
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-}
    volumes:
      - minio_data:/data

  # One-shot: create the bucket and apply anonymous-read policy.
  # Without this, image URLs returned by the API return 403 to unsigned clients.
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY:-minioadmin}:${S3_SECRET_KEY:-minioadmin}@minio:9000
      S3_BUCKET: ${S3_BUCKET:-your-drive}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc ls local >/dev/null 2>&1; do
          echo "waiting for minio..."; sleep 1;
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set download "local/$$S3_BUCKET"
        mc anonymous get "local/$$S3_BUCKET"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3003}
        # Google Maps (frontend - restrict to HTTP referrers/websites)
        # VITE_GOOGLE_API_KEY: ...
        # Google OAuth
        # VITE_GOOGLE_CLIENT_ID: ...
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLIENT_PORT:-8480}:80"
    depends_on:
      - server

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-yourdomain.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - client
      - server
      - minio

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
