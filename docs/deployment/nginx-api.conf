# api.yourdrive.rw -> server container (127.0.0.1:3003)
# Install: sudo cp nginx-api.conf /etc/nginx/sites-available/api.yourdrive.rw
#          sudo ln -s /etc/nginx/sites-available/api.yourdrive.rw /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (see README.md) to add the HTTPS block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdrive.rw;

    # Allow larger file uploads (KYC docs, ride photos, etc.)
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        # WebSocket upgrade support (Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
