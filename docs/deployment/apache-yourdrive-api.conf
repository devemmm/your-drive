SuexecUserGroup #1169 #1069
ServerName yourdrive-api.uat.co.zw
ServerAlias www.yourdrive-api.uat.co.zw
ServerAlias mail.yourdrive-api.uat.co.zw
ServerAlias webmail.yourdrive-api.uat.co.zw
ServerAlias admin.yourdrive-api.uat.co.zw
DocumentRoot /home/yourdrive-api/public_html
ErrorLog /var/log/virtualmin/yourdrive-api.uat.co.zw_error_log
CustomLog /var/log/virtualmin/yourdrive-api.uat.co.zw_access_log combined
ScriptAlias /cgi-bin/ /home/yourdrive-api/cgi-bin/
DirectoryIndex index.php index.htm index.html
<Directory /home/yourdrive-api/public_html>
    Options -Indexes +IncludesNOEXEC +SymLinksIfOwnerMatch +ExecCGI
    Require all granted
    AllowOverride All
    AddHandler fcgid-script .php
    AddHandler fcgid-script .php7.4
    AddHandler fcgid-script .php8.1
    AddHandler fcgid-script .php8.2
    AddHandler fcgid-script .php8.3
    AddHandler fcgid-script .php8.4
    FCGIWrapper /home/yourdrive-api/fcgi-bin/php8.4.fcgi .php
    FCGIWrapper /home/yourdrive-api/fcgi-bin/php7.4.fcgi .php7.4
    FCGIWrapper /home/yourdrive-api/fcgi-bin/php8.1.fcgi .php8.1
    FCGIWrapper /home/yourdrive-api/fcgi-bin/php8.2.fcgi .php8.2
    FCGIWrapper /home/yourdrive-api/fcgi-bin/php8.3.fcgi .php8.3
    FCGIWrapper /home/yourdrive-api/fcgi-bin/php8.4.fcgi .php8.4
</Directory>
<Directory /home/yourdrive-api/cgi-bin>
    Require all granted
    AllowOverride All
</Directory>

# ---- Node.js API reverse proxy ----
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 600

# Tell the Node app the original scheme/host/IP
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port "443"

# Don't proxy Let's Encrypt challenges or Virtualmin control panel paths
ProxyPass /.well-known !

# Conditional WebSocket / HTTP proxy (WebSocket rule MUST come first)
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule /(.*) ws://localhost:3003/$1 [P,L]
RewriteCond %{HTTP:Upgrade} !=websocket [NC]
RewriteRule /(.*) http://localhost:3003/$1 [P,L]

ProxyPassReverse / http://localhost:3003/

# Virtualmin panel redirects
RewriteCond %{HTTP_HOST} =webmail.yourdrive-api.uat.co.zw
RewriteRule ^/(?!.well-known)(.*)$ https://yourdrive-api.uat.co.zw:20000/ [R]
RewriteCond %{HTTP_HOST} =admin.yourdrive-api.uat.co.zw
RewriteRule ^/(?!.well-known)(.*)$ https://yourdrive-api.uat.co.zw:10000/ [R]

RemoveHandler .php
RemoveHandler .php7.4
RemoveHandler .php8.1
RemoveHandler .php8.2
RemoveHandler .php8.3
RemoveHandler .php8.4
FcgidMaxRequestLen 1073741824
SSLEngine on
SSLCertificateFile /etc/ssl/virtualmin/17753746322907879/ssl.cert
SSLCertificateKeyFile /etc/ssl/virtualmin/17753746322907879/ssl.key
SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
SSLCACertificateFile /etc/ssl/virtualmin/17753746322907879/ssl.ca
