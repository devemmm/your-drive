# storage.yourdrive.rw -> minio container (127.0.0.1:9000)
# Install: sudo cp nginx-storage.conf /etc/nginx/sites-available/storage.yourdrive.rw
#          sudo ln -s /etc/nginx/sites-available/storage.yourdrive.rw /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (see README.md) to add the HTTPS block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name storage.yourdrive.rw;

    # Large file uploads/downloads go through here
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
