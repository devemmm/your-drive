SuexecUserGroup #1171 #1071
ServerName yourdrive-minio.uat.co.zw
ServerAlias www.yourdrive-minio.uat.co.zw
ServerAlias mail.yourdrive-minio.uat.co.zw
ServerAlias webmail.yourdrive-minio.uat.co.zw
ServerAlias admin.yourdrive-minio.uat.co.zw
DocumentRoot /home/yourdrive-minio/public_html
ErrorLog /var/log/virtualmin/yourdrive-minio.uat.co.zw_error_log
CustomLog /var/log/virtualmin/yourdrive-minio.uat.co.zw_access_log combined
ScriptAlias /cgi-bin/ /home/yourdrive-minio/cgi-bin/
DirectoryIndex index.php index.htm index.html
<Directory /home/yourdrive-minio/public_html>
    Options -Indexes +IncludesNOEXEC +SymLinksIfOwnerMatch +ExecCGI
    Require all granted
    AllowOverride All
    AddHandler fcgid-script .php
    AddHandler fcgid-script .php7.4
    AddHandler fcgid-script .php8.1
    AddHandler fcgid-script .php8.2
    AddHandler fcgid-script .php8.3
    AddHandler fcgid-script .php8.4
    FCGIWrapper /home/yourdrive-minio/fcgi-bin/php8.4.fcgi .php
    FCGIWrapper /home/yourdrive-minio/fcgi-bin/php7.4.fcgi .php7.4
    FCGIWrapper /home/yourdrive-minio/fcgi-bin/php8.1.fcgi .php8.1
    FCGIWrapper /home/yourdrive-minio/fcgi-bin/php8.2.fcgi .php8.2
    FCGIWrapper /home/yourdrive-minio/fcgi-bin/php8.3.fcgi .php8.3
    FCGIWrapper /home/yourdrive-minio/fcgi-bin/php8.4.fcgi .php8.4
</Directory>
<Directory /home/yourdrive-minio/cgi-bin>
    Require all granted
    AllowOverride All
</Directory>

# ---- MinIO Console reverse proxy ----
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 600

# Tell MinIO the original scheme so it builds correct redirect URLs
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port "443"

# Allow large uploads through the console (up to ~5GB, adjust if needed)
LimitRequestBody 5368709120

# Don't proxy Let's Encrypt challenges or Virtualmin control panel paths
ProxyPass /.well-known !

# Conditional WebSocket / HTTP proxy (WebSocket rule MUST come first)
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule /(.*) ws://localhost:9481/$1 [P,L]
RewriteCond %{HTTP:Upgrade} !=websocket [NC]
RewriteRule /(.*) http://localhost:9481/$1 [P,L]

ProxyPassReverse / http://localhost:9481/

# Virtualmin panel redirects
RewriteCond %{HTTP_HOST} =webmail.yourdrive-minio.uat.co.zw
RewriteRule ^/(?!.well-known)(.*)$ https://yourdrive-minio.uat.co.zw:20000/ [R]
RewriteCond %{HTTP_HOST} =admin.yourdrive-minio.uat.co.zw
RewriteRule ^/(?!.well-known)(.*)$ https://yourdrive-minio.uat.co.zw:10000/ [R]

RemoveHandler .php
RemoveHandler .php7.4
RemoveHandler .php8.1
RemoveHandler .php8.2
RemoveHandler .php8.3
RemoveHandler .php8.4
FcgidMaxRequestLen 1073741824
SSLEngine on
SSLCertificateFile /etc/ssl/virtualmin/17753752472929301/ssl.cert
SSLCertificateKeyFile /etc/ssl/virtualmin/17753752472929301/ssl.key
SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
SSLCACertificateFile /etc/ssl/virtualmin/17753752472929301/ssl.ca
