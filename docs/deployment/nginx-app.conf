# app.yourdrive.rw -> client container (127.0.0.1:8480)
# Install: sudo cp nginx-app.conf /etc/nginx/sites-available/app.yourdrive.rw
#          sudo ln -s /etc/nginx/sites-available/app.yourdrive.rw /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (see README.md) to add the HTTPS block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name app.yourdrive.rw;

    location / {
        proxy_pass http://127.0.0.1:8480;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
